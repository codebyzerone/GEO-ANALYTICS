services:
  backend:
    build: ./backend
    container_name: geo-analytics-backend
    restart: unless-stopped
    environment:
      - CORS_ALLOW_ORIGINS=http://localhost:5173,http://127.0.0.1:5173
      - CACHE_TTL_SECONDS=600
      - DATABASE_URL=sqlite:///./geo_analytics.db
      - APP_NAME=GEO Analytics API
      - APP_VERSION=1.0.0
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app

  frontend:
    build: ./frontend
    container_name: geo-analytics-frontend
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      - backend